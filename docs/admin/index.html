<style>
/* Layout: dark header bar, client list on the left, that client's requests on the right; stacks on phones */
:root{--bg:#f6f5f2;--paper:#fff;--ink:#24221f;--muted:#6b665f;--line:#e3dfd8;--accent:#c2541b;--on-accent:#fff;--bar:#24221f;--on-bar:#f6f5f2;--ok:#2f7a4b;--bad:#b3261e;--pin:#1f5fa8;--on-pin:#fff;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1917;--paper:#23211f;--ink:#ece8e1;--muted:#a39d94;--line:#3a3733;--accent:#e47a3f;--on-accent:#1a1917;--bar:#0f0e0d;--on-bar:#ece8e1;--ok:#5fbf83;--bad:#ef7a72;--pin:#7fb2ea;--on-pin:#10233a;--hover:#2b2926;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1917;--paper:#23211f;--ink:#ece8e1;--muted:#a39d94;--line:#3a3733;--accent:#e47a3f;--on-accent:#1a1917;--bar:#0f0e0d;--on-bar:#ece8e1;--ok:#5fbf83;--bad:#ef7a72;--pin:#7fb2ea;--on-pin:#10233a;--hover:#2b2926;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--text)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{background:var(--bar);color:var(--on-bar);border-bottom:1px solid rgb(255 255 255 / .06)}
.hdr-in{max-width:1180px;margin:0 auto;min-height:64px;display:flex;gap:12px 16px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand .tag{font:600 11px/1 var(--text);letter-spacing:.16em;text-transform:uppercase;opacity:.7;padding-left:12px;border-left:1px solid rgb(255 255 255 / .22);height:22px;display:flex;align-items:center}
.nav{display:flex;gap:2px;align-items:center;background:rgb(255 255 255 / .07);padding:3px;border-radius:10px}

.nav button:hover{opacity:1}
.nav button[aria-pressed="true"]{background:rgb(255 255 255 / .13);opacity:1}
.badge{font-size:11px;font-weight:700;line-height:18px;min-width:18px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);text-align:center;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:2px}
.icon-btn{background:none;border:0;color:var(--on-bar);opacity:.7;border-radius:8px;padding:8px 10px;display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:600}
.icon-btn:hover{opacity:1;background:rgb(255 255 255 / .08)}

.main{max-width:1180px;margin:0 auto;padding-block:28px 64px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}

.none{padding:52px 24px;color:var(--muted);display:grid;gap:6px;justify-items:center;text-align:center}
.none b{color:var(--ink);font-size:16px}
.none .ok-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);margin-bottom:6px}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}
.link.bad{color:var(--bad)}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;gap:7px;align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.06)}
.btn.plain{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.plain:hover{background:var(--hover);filter:none}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.btn.danger{background:none;border:1px solid transparent;color:var(--bad)}
.btn.danger:hover{border-color:color-mix(in srgb,var(--bad) 40%,transparent);filter:none}
.btn[disabled]{opacity:.5;cursor:default}
.gate{max-width:440px;margin:12vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:36px 34px 30px;display:grid;gap:12px;text-align:center;box-shadow:0 18px 50px -24px rgb(0 0 0 / .35)}

.gate .field{text-align:left}.gate .field label{display:block;text-align:center;font-size:15px}
.gate input{font-size:17px;padding:12px 14px;text-align:center}
.gate .btn{font-size:17px;padding:13px 18px}
.gate .err{text-align:center}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field label{font-size:13px;font-weight:600}
.field input,.pw-edit input{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);width:100%;min-height:40px}

.pw{font:600 14px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.mini{background:none;border:0;border-radius:6px;padding:5px;color:var(--muted);display:inline-grid;place-items:center}

.send{margin:0 24px 20px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}

.veil{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;place-items:center;padding:20px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
</style>

    return fetch(API + path, { method: body ? "POST" : "GET", headers: headers, body: body ? JSON.stringify(body) : undefined })
      .then(function(r){ return r.json().then(function(d){ d.status = r.status; return d; }); })

      .then(function(d){ if (d.status === 401 && path !== "/api/admin/login") { logout("Please log in again."); } return d; });
  }
  function demoCall(path, b){
    if (path === "/api/admin/login") return b.password.trim().toLowerCase() === "wolf" ? {ok:true, token:"demo"} : {ok:false, error:'That password isn\'t right. In this demo it\'s "wolf".'};
    if (path === "/api/admin/data") { if (!demoCall.d) demoCall.d = demoData(); return {ok:true, clients:demoCall.d.clients, batches:demoCall.d.batches}; }
    var d = demoCall.d;
    if (path === "/api/admin/done") { d.batches.forEach(function(x){ if (x.id === b.batch) x.notes.forEach(function(n){ if (n.n === b.n) n.done = b.done; }); }); return {ok:true}; }

  }
  var picCache = {};
  function picSrc(key){
    if (picCache[key]) return picCache[key];
    return picCache[key] = DEMO ? Promise.resolve(demoPic(key)) :
      fetch(API + "/api/admin/pic?key=" + encodeURIComponent(key), { headers: { authorization: "Bearer " + token } })
        .then(function(r){ if (!r.ok) throw 0; return r.blob(); }).then(function(b){ return URL.createObjectURL(b); }).catch(function(){ delete picCache[key]; return ""; });
  }

  /* ---------- login ---------- */
  function showGate(msg){ $("app").hidden = true; $("gate").hidden = false; $("demo-note").hidden = !DEMO; $("err").hidden = !msg; $("err").textContent = msg || ""; $("pw").value = ""; $("pw").focus(); }

  $("refresh").onclick = function(){ load(true); };
  $("v-req").onclick = function(){ view = "req"; draw(); };

  function load(say){

      if (!d.ok) { if (d.status !== 401) { $("gate").hidden = true; $("app").hidden = false; $("main").textContent = ""; $("main").appendChild(el("p",{class:"err",text:d.error || "Couldn't load."})); } return; }
      data = d; $("gate").hidden = true; $("app").hidden = false;
      if (say) toast("Up to date.");
      draw();
    });
  }

  /* ---------- requests view ---------- */
  function nameOf(site){ var c = data.clients.filter(function(x){ return x.site === site; })[0]; return c ? c.name : site + " (removed client)"; }
  function openCount(site){ var n = 0; data.batches.forEach(function(b){ if (!site || b.site === site) b.notes.forEach(function(x){ if (!x.done) n++; }); }); return n; }
  function sites(){
    var list = data.clients.map(function(c){ return c.site; });
    data.batches.forEach(function(b){ if (list.indexOf(b.site) < 0) list.push(b.site); });
    return list;
  }
  function draw(){
    $("v-req").setAttribute("aria-pressed", view === "req"); $("v-cli").setAttribute("aria-pressed", view === "cli");
    var total = openCount(null); $("req-n").hidden = !total; $("req-n").textContent = total ? String(total) : "";
    var main = $("main"); main.textContent = ""; main.className = "main gut" + (view === "cli" ? " one" : "");
    if (view === "cli") return drawClients(main);
    var all = sites(); if (cur && all.indexOf(cur) < 0) cur = null;
    var ul = el("ul",{class:"clients"});
    [null].concat(all).forEach(function(site){
      var n = openCount(site);
      ul.appendChild(el("li",{},[el("button",{type:"button","aria-current":String(site === cur),onclick:function(){ cur = site; draw(); }},[
        el("b",{text: site ? nameOf(site) : "All clients"}), n ? el("span",{class:"count",title:n + " open",text:String(n)}) : el("span",{class:"count zero",title:"All done"},[ico("check",16)])])]));
    });
    main.appendChild(el("nav",{class:"side","aria-label":"Clients"},[el("p",{class:"label",text:"Clients"}), ul]));

    var card = el("section",{class:"card"}), client = data.clients.filter(function(c){ return c.site === cur; })[0];
    var tabs = el("div",{class:"tabs"});
    [["open","Open"],["done","Done"],["all","All"]].forEach(function(t){ tabs.appendChild(el("button",{type:"button","aria-pressed":String(show === t[0]),text:t[1],onclick:function(){ show = t[0]; draw(); }})); });
    card.appendChild(el("div",{class:"card-hd"},[el("div",{},[el("h2",{text: cur ? nameOf(cur) : "All clients"}), client && client.url ? el("a",{class:"sub",href:/^https?:/.test(client.url) ? client.url : "https://" + client.url,target:"_blank",rel:"noopener",text:client.url.replace(/^https?:\/\//,"").replace(/\/+$/,"")}) : el("div",{class:"sub",text: cur ? "" : "Every client's requests, newest first"})]), tabs]));
    var any = false;
    data.batches.forEach(function(b){
      if (cur && b.site !== cur) return;
      var rows = b.notes.filter(function(n){ return show === "all" || (show === "done") === !!n.done; });
      if (!rows.length) return; any = true;
      var del = el("button",{class:"btn sm danger",type:"button",text:"Delete",onclick:function(){
        if (del.textContent === "Delete") { del.textContent = "Really delete these notes and pictures?"; setTimeout(function(){ del.textContent = "Delete"; }, 4000); return; }
        call("/api/admin/batch/delete",{batch:b.id}).then(function(d){ if (d.ok) { toast("Deleted."); load(); } });
      }});
      var box = el("div",{class:"batch"},[el("div",{class:"batch-hd"},[el("h3",{text:(cur ? "" : nameOf(b.site) + " · ") + "Sent " + when(b.at)}), del])]);
      rows.forEach(function(n){
        var pics = n.pics.length ? el("div",{class:"pics"}) : null;
        n.pics.forEach(function(key, i){
          var btn = el("button",{type:"button","aria-label":"Open picture " + (i + 1),text:"…",onclick:function(){ viewer(key); }});
          picSrc(key).then(function(src){ btn.textContent = ""; if (src) btn.appendChild(el("img",{src:src,alt:""})); else btn.textContent = "missing"; });
          pics.appendChild(btn);
        });
        var cb = el("input",{type:"checkbox",id:"cb-" + b.id + "-" + n.n,onchange:function(){
          n.done = cb.checked; call("/api/admin/done",{batch:b.id,n:n.n,done:cb.checked}).then(function(d){ if (!d.ok) toast(d.error || "That didn't save."); draw(); });
        }}); cb.checked = !!n.done;
        box.appendChild(el("div",{class:"req" + (n.done ? " is-done" : "")},[
          el("span",{class:"num",text:String(n.n)}),
          el("div",{},[el("div",{class:"sub",text:(n.title ? n.title + " · " : "") + n.on}), el("div",{class:"says",text:n.text || "(pictures only)"}), pics]),
          el("label",{class:"done"},[cb,"Done"])]));
      });
      card.appendChild(box);
    });
    if (!any) card.appendChild(show === "open" ? el("div",{class:"none"},[el("span",{class:"ok-dot"},[ico("check",22)]), el("b",{text:"All caught up"}), el("span",{text:"Nothing open" + (cur ? " for " + nameOf(cur) : "") + ". New requests show up here."})]) : el("div",{class:"none"},[el("span",{text:"Nothing here yet."})]));
    main.appendChild(card);
  }
  function viewer(key){
    var img = el("img",{alt:"Picture from the client"}), save = el("a",{text:"Save picture",download:key.replace(/[^\w-]+/g,"-") + ".jpg",target:"_blank",rel:"noopener"});
    var veil = el("div",{class:"veil",role:"dialog","aria-label":"Picture",onclick:function(e){ if (e.target === veil) veil.remove(); }},[img, el("div",{class:"row"},[save, el("button",{type:"button",text:"Close",onclick:function(){ veil.remove(); }})])]);
    picSrc(key).then(function(src){ img.src = src; save.href = src; });
    document.body.appendChild(veil);
  }

  /* ---------- clients and passwords view ---------- */
  function sendText(c){ var site = c.url ? c.url.replace(/^https?:\/\//,"").replace(/\/+$/,"") : "[their site address]";
    return "Here's how to ask me for changes to your website:\n\n1. Go to " + site + "/portal (or press and hold the little wolf at the very bottom of your website for 2 seconds).\n2. Type this password: " + c.password + "\n3. Tap a box to send me what I need. To ask for a change, tap Open Edit mode, tap the part you mean, and type what you'd like. You can add photos too.\n4. Tap Send to Stray Wolf. That's it.\n\nYou can't break anything. Nothing on your website changes until I make the update."; }
  function drawClients(main){
    var stack = el("div",{class:"stack"}), card = el("section",{class:"card","aria-label":"Add a client"});
    stack.appendChild(el("div",{class:"page-hd"},[el("h2",{text:"Clients and passwords"}), el("p",{text:"Add a client right after you meet, then send them their address and password."})]));
    card.appendChild(el("div",{class:"card-hd"},[el("h2",{text:"Add a client"})]));
    var name = el("input",{id:"c-name",placeholder:"Cedar Street Barbers"}), url = el("input",{id:"c-url",placeholder:"cedarstreetbarbers.com"}),
        site = el("input",{id:"c-site",placeholder:"cedar-street-barbers"}), pw = el("input",{id:"c-pw",value:newPassword()}), err = el("p",{class:"err",hidden:true});
    var touched = false; site.oninput = function(){ touched = true; }; name.oninput = function(){ if (!touched) site.value = slug(name.value); };
    var add = el("button",{class:"btn",type:"submit",text:"Add client"});
    card.appendChild(el("form",{class:"pad",onsubmit:function(e){
      e.preventDefault(); err.hidden = true;
      if (!name.value.trim()) { err.textContent = "Give the client a name."; err.hidden = false; return; }

      call("/api/admin/client",{site:site.value.trim(),name:name.value.trim(),url:url.value.trim(),password:pw.value.trim()}).then(function(d){
        add.disabled = false;
        if (!d.ok) { err.textContent = d.error || "That didn't save."; err.hidden = false; return; }
        lastAdded = d.client.site; toast("Client added."); load();
      });
    }},[
      el("div",{class:"form"},[
        el("div",{class:"field"},[el("label",{for:"c-name",text:"Business name"}), name]),
        el("div",{class:"field"},[el("label",{for:"c-url",text:"Site address"}), url, el("small",{text:"Their live site, or the preview address before launch."})]),
        el("div",{class:"field"},[el("label",{for:"c-site",text:"Short name"}), site, el("small",{text:"Lowercase letters, numbers and dashes. Goes in their site's code."})]),
        el("div",{class:"field"},[el("label",{for:"c-pw",text:"Their password"}), pw, el("small",{text:"Made up for you. Change it if you like (6 or more characters)."})])
      ]), err, el("div",{class:"form-foot"},[add])
    ]));
    var addCard = card;
    card = el("section",{class:"card","aria-label":"Your clients"});
    card.appendChild(el("div",{class:"card-hd"},[el("h2",{text:"Your clients"}), el("span",{class:"sub",text:data.clients.length === 1 ? "1 client" : data.clients.length + " clients"})]));
    if (!data.clients.length) card.appendChild(el("div",{class:"none"},[el("span",{text:"No clients yet. Add one below."})]));
    data.clients.forEach(function(c){
      var rm = el("button",{class:"btn sm danger",type:"button",text:"Remove",onclick:function(){
        if (rm.textContent === "Remove") { rm.textContent = "Really remove? Their login stops working."; setTimeout(function(){ rm.textContent = "Remove"; }, 4000); return; }
        call("/api/admin/client/delete",{site:c.site}).then(function(d){ if (d.ok) { toast("Removed."); load(); } });
      }});
      var pwBox = el("div",{},[el("div",{class:"label",style:"margin-bottom:6px",text:"Password"}), el("div",{class:"pw-chip"},[el("span",{class:"pw",text:c.password}), el("button",{class:"mini",type:"button",title:"Copy password","aria-label":"Copy password for " + c.name,onclick:function(){ copy(c.password); }},[ico("copy",14)])])]);
      // Change password: type any password (6 or more characters), or tap "Make one for me"
      function editPw() {
        var inp = el("input",{value:c.password,"aria-label":"New password for " + c.name,autocomplete:"off",spellcheck:"false"}), msg = el("p",{class:"err",hidden:true});
        function save(v) {
          v = String(v || "").trim();
          if (v.length < 6) { msg.textContent = "Use at least 6 characters."; msg.hidden = false; return; }
          if (v === c.password) { load(); return; }
          call("/api/admin/client",{site:c.site,password:v}).then(function(d){
            if (d.ok) { lastAdded = c.site; toast("Password changed. The old one no longer works."); load(); }
            else { msg.textContent = d.error || "That didn't save. Try again."; msg.hidden = false; }
          });
        }
        inp.addEventListener("keydown",function(e){ if (e.key === "Enter") save(inp.value); if (e.key === "Escape") load(); });
        pwBox.replaceChildren(el("div",{class:"pw-edit"},[el("div",{class:"label",style:"margin:0",text:"New password"}), inp, msg,
          el("div",{class:"acts",style:"justify-content:flex-start"},[
            el("button",{class:"btn sm",type:"button",text:"Save",onclick:function(){ save(inp.value); }}),
            el("button",{class:"btn sm plain",type:"button",text:"Make one for me",onclick:function(){ inp.value = newPassword(); inp.focus(); }}),
            el("button",{class:"btn sm plain",type:"button",text:"Cancel",onclick:function(){ load(); }})])]));
        inp.focus(); inp.select();
      }
      var row = el("div",{class:"crow"},[
        el("div",{},[el("b",{text:c.name}), el("div",{class:"meta"},[el("span",{class:"sub",text:c.url ? c.url.replace(/^https?:\/\//,"").replace(/\/+$/,"") : "No site address yet"}), el("span",{class:"sub mono",text:"Short name: " + c.site})])]),
        pwBox,
        el("div",{class:"acts"},[
          el("button",{class:"btn sm plain",type:"button",onclick:function(){ lastAdded = c.site; draw(); }},[ico("send",14),"Invite text"]),
          el("button",{class:"btn sm plain",type:"button",text:"Change password",onclick:function(){ editPw(); }}),
          el("button",{class:"btn sm plain",type:"button",text:"New password",onclick:function(){ call("/api/admin/client",{site:c.site,password:newPassword()}).then(function(d){ if (d.ok) { lastAdded = c.site; toast("New password set. The old one no longer works."); load(); } }); }}),
          rm])
      ]);
      card.appendChild(row);
      if (lastAdded === c.site) card.appendChild(el("div",{class:"send"},[el("div",{class:"send-hd"},[el("p",{class:"label",text:"Send this to " + c.name}), el("button",{class:"btn sm",type:"button",onclick:function(){ copy(sendText(c)); }},[ico("copy",14),"Copy"])]), el("div",{class:"sendbox",text:sendText(c)})]));
    });
    stack.appendChild(card); stack.appendChild(addCard);
    main.appendChild(stack);
  }

  if (token) load(); else showGate();
})();
