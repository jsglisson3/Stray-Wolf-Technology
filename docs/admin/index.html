<style>
/* Layout: dark header bar, client list on the left, that client's requests on the right; stacks on phones */
:root{--bg:#f6f5f2;--paper:#fff;--ink:#24221f;--muted:#6b665f;--line:#e3dfd8;--accent:#c2541b;--on-accent:#fff;--bar:#24221f;--on-bar:#f6f5f2;--ok:#2f7a4b;--bad:#b3261e;--pin:#1f5fa8;--on-pin:#fff;
  --hover:#efece6;--display:"Zilla Slab",Georgia,serif;--text:"Inter",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1917;--paper:#23211f;--ink:#ece8e1;--muted:#a39d94;--line:#3a3733;--accent:#e47a3f;--on-accent:#1a1917;--bar:#0f0e0d;--on-bar:#ece8e1;--ok:#5fbf83;--bad:#ef7a72;--pin:#7fb2ea;--on-pin:#10233a;--hover:#2b2926;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1917;--paper:#23211f;--ink:#ece8e1;--muted:#a39d94;--line:#3a3733;--accent:#e47a3f;--on-accent:#1a1917;--bar:#0f0e0d;--on-bar:#ece8e1;--ok:#5fbf83;--bad:#ef7a72;--pin:#7fb2ea;--on-pin:#10233a;--hover:#2b2926;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:385 15px/1.5 var(--text)}
b,strong,th,h3,h4,h5{font-weight:575}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{background:var(--bar);color:var(--on-bar);border-bottom:1px solid rgb(255 255 255 / .06)}
.hdr-in{max-width:1180px;margin:0 auto;min-height:64px;display:flex;gap:12px 16px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0;background:none;border:0;padding:6px 8px;margin-left:-8px;border-radius:8px;color:var(--on-bar)}
.brand:hover{background:rgb(255 255 255 / .06)}
.brand img{height:30px;width:auto;display:block}
.brand .tag{font:575 11px/1 var(--text);letter-spacing:.16em;text-transform:uppercase;opacity:.7;padding-left:12px;border-left:1px solid rgb(255 255 255 / .22);height:22px;display:flex;align-items:center}
.nav{display:flex;gap:2px;align-items:center;background:rgb(255 255 255 / .07);padding:3px;border-radius:10px}
.nav button{background:none;border:0;border-radius:7px;padding:7px 13px;white-space:nowrap;font-size:14px;font-weight:575;color:var(--on-bar);opacity:.7;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.nav button:hover{opacity:1}
.nav button[aria-pressed="true"]{background:rgb(255 255 255 / .13);opacity:1}
.badge{font-size:11px;font-weight:670;line-height:18px;min-width:18px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);text-align:center;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:2px}

@media (max-width:900px){.hdr-in{padding-block:10px;flex-wrap:wrap}.nav{order:3;width:100%;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{flex:1 0 auto}}

.says{overflow-wrap:anywhere;white-space:pre-line}
.where{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:10px 12px;margin:0 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.where.portal{grid-template-columns:auto minmax(0,1fr)}
.where-txt{min-width:0;display:grid;gap:2px}

.where-2{font-size:13.5px;color:var(--ink);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.where-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--pin) 14%,transparent);color:var(--pin)}
.pmap{position:relative;width:28px;height:40px;border:1.5px solid color-mix(in srgb,var(--muted) 55%,transparent);border-radius:5px;background:repeating-linear-gradient(to bottom,transparent 0 7px,color-mix(in srgb,var(--muted) 18%,transparent) 7px 8px);background-clip:content-box;padding:4px 5px}
.pdot{position:absolute;left:50%;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg);transform:translate(-50%,-50%)}
.where .btn{white-space:nowrap}
.shot{width:136px;aspect-ratio:16/10;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);cursor:zoom-in;display:block}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot:hover,.shot:focus-visible{border-color:var(--accent)}
.veil .veil-go{background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:6px}
.req-body{min-width:0}
@media (max-width:640px){.req{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"num done" "body body";gap:8px 10px}.req>.num{grid-area:num}.req>.done{grid-area:done;justify-self:end}.req>.req-body{grid-area:body}.where{grid-template-columns:auto minmax(0,1fr);padding:10px}.where .btn{grid-column:1/-1;justify-self:stretch;justify-content:center}.where.has-shot{grid-template-columns:minmax(0,1fr)}.where.has-shot .shot{width:100%}}
.says{font-size:15.5px}

.pics{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.pic figcaption.no-cap{color:var(--muted);font-style:italic}
@media (max-width:560px){.pic,.pics .pic button{width:calc(50vw - 64px)}.pics .pic button{height:auto;aspect-ratio:4/3}}
.done{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:575;white-space:nowrap;color:var(--muted)}
.done input{width:18px;height:18px;accent-color:var(--ok)}
.req.is-done .says{text-decoration:line-through;color:var(--muted)}
.none{padding:52px 24px;color:var(--muted);display:grid;gap:6px;justify-items:center;text-align:center}
.none b{color:var(--ink);font-size:16px}
.none .ok-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);margin-bottom:6px}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}
.link.bad{color:var(--bad)}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:9px 16px;font-weight:575;font-size:14px;display:inline-flex;gap:7px;align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.06)}
.btn.plain{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.plain:hover{background:var(--hover);filter:none}

.gate{max-width:440px;margin:12vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:36px 34px 30px;display:grid;gap:12px;text-align:center;box-shadow:0 18px 50px -24px rgb(0 0 0 / .35)}

.field{display:grid;gap:6px;min-width:0;align-content:start}

/* ---------- Overview (the cockpit) ---------- */
.home{display:grid;gap:22px;width:100%}

        el("div",{},[el("b",{text:c.name}), el("div",{class:"meta"},[el("span",{class:"sub",text:c.url ? c.url.replace(/^https?:\/\//,"").replace(/\/+$/,"") : "No site address yet"}), el("span",{class:"sub mono",text:"Short name: " + c.site})])]),
        pwBox,
        el("div",{class:"acts"},[
          el("button",{class:"btn sm plain",type:"button",onclick:function(){ lastAdded = c.site; draw(); }},[ico("send",14),"Invite text"]),
          el("button",{class:"btn sm plain",type:"button",text:"Change password",onclick:function(){ editPw(); }}),
          el("button",{class:"btn sm plain",type:"button",text:"New password",onclick:function(){ call("/api/admin/client",{site:c.site,password:newPassword()}).then(function(d){ if (d.ok) { lastAdded = c.site; toast("New password set. The old one no longer works."); load(); } }); }}),
          rm])
      ]);
      card.appendChild(row);
      if (lastAdded === c.site) card.appendChild(el("div",{class:"send"},[el("div",{class:"send-hd"},[el("p",{class:"label",text:"Send this to " + c.name}), el("button",{class:"btn sm",type:"button",onclick:function(){ copy(sendText(c)); }},[ico("copy",14),"Copy"])]), el("div",{class:"sendbox",text:sendText(c)})]));
    });
    stack.appendChild(card); stack.appendChild(addCard);
    main.appendChild(stack);
    if (wantAdd) { wantAdd = false; addCard.scrollIntoView({block:"center"}); name.focus(); }
  }

  if (token) load(); else showGate();
})();
</script>
