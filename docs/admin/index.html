<style>
/* Layout: dark header bar, client list on the left, that client's requests on the right; stacks on phones */
:root{--bg:#f6f5f2;--paper:#fff;--ink:#24221f;--muted:#6b665f;--line:#e3dfd8;--accent:#c2541b;--on-accent:#fff;--bar:#24221f;--on-bar:#f6f5f2;--ok:#2f7a4b;--bad:#b3261e;--pin:#1f5fa8;--on-pin:#fff;
  --hover:#efece6;--display:"Zilla Slab",Georgia,serif;--text:"Inter",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1917;--paper:#23211f;--ink:#ece8e1;--muted:#a39d94;--line:#3a3733;--accent:#e47a3f;--on-accent:#1a1917;--bar:#0f0e0d;--on-bar:#ece8e1;--ok:#5fbf83;--bad:#ef7a72;--pin:#7fb2ea;--on-pin:#10233a;--hover:#2b2926;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1917;--paper:#23211f;--ink:#ece8e1;--muted:#a39d94;--line:#3a3733;--accent:#e47a3f;--on-accent:#1a1917;--bar:#0f0e0d;--on-bar:#ece8e1;--ok:#5fbf83;--bad:#ef7a72;--pin:#7fb2ea;--on-pin:#10233a;--hover:#2b2926;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--text)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{background:var(--bar);color:var(--on-bar);border-bottom:1px solid rgb(255 255 255 / .06)}
.hdr-in{max-width:1180px;margin:0 auto;min-height:64px;display:flex;gap:12px 16px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0;background:none;border:0;padding:6px 8px;margin-left:-8px;border-radius:8px;color:var(--on-bar)}
.brand:hover{background:rgb(255 255 255 / .06)}
.brand img{height:30px;width:auto;display:block}
.brand .tag{font:600 11px/1 var(--text);letter-spacing:.16em;text-transform:uppercase;opacity:.7;padding-left:12px;border-left:1px solid rgb(255 255 255 / .22);height:22px;display:flex;align-items:center}
.nav{display:flex;gap:2px;align-items:center;background:rgb(255 255 255 / .07);padding:3px;border-radius:10px}
.nav button{background:none;border:0;border-radius:7px;padding:7px 13px;white-space:nowrap;font-size:14px;font-weight:600;color:var(--on-bar);opacity:.7;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.nav button:hover{opacity:1}
.nav button[aria-pressed="true"]{background:rgb(255 255 255 / .13);opacity:1}
.badge{font-size:11px;font-weight:700;line-height:18px;min-width:18px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);text-align:center;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:2px}
.icon-btn{background:none;border:0;color:var(--on-bar);opacity:.7;border-radius:8px;padding:8px 10px;display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:600}
.icon-btn:hover{opacity:1;background:rgb(255 255 255 / .08)}
.icon-btn svg,.ico{flex:none}
@media (max-width:900px){.hdr-in{padding-block:10px;flex-wrap:wrap}.nav{order:3;width:100%;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{flex:1 0 auto}}
@media (max-width:640px){.nav button{padding:7px 6px;font-size:13px;gap:5px}.icon-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}}
.main{max-width:1180px;margin:0 auto;padding-block:28px 64px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.main.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:780px){.main{grid-template-columns:minmax(0,1fr);padding-block:20px 48px}}
.label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.side .label{padding-left:12px}
.clients{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.clients button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 12px;display:flex;gap:10px;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.clients button:hover{background:var(--hover);color:var(--ink)}
.clients button[aria-current="true"]{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line),inset 3px 0 0 var(--accent)}
.clients b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.count{font-size:11px;font-weight:700;line-height:20px;min-width:20px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--on-accent);flex:none;text-align:center;font-variant-numeric:tabular-nums}
.count.zero{background:none;color:var(--ok);padding:0;display:inline-grid;place-items:center}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;min-width:0;box-shadow:0 1px 2px rgb(0 0 0 / .04)}
.card-hd{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center}
.card-hd h2{font-size:22px;line-height:1.2}
.sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
a.sub{text-decoration:none}a.sub:hover{text-decoration:underline;color:var(--ink)}
.tabs{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs button{border:0;background:none;border-radius:6px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .14),0 0 0 1px var(--line)}
.batch{padding:16px 24px 10px}
.batch+.batch{border-top:1px solid var(--line)}
.batch-hd{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.batch-hd h3{font:600 12px/1.3 var(--text);letter-spacing:.04em;color:var(--muted)}
.req{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.batch-hd+.req{border-top:0}
.num{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--pin);color:var(--on-pin);font-size:12px;font-weight:600}
.says{overflow-wrap:anywhere;white-space:pre-line}
.pics{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pics button{width:88px;height:66px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0;overflow:hidden;font-size:11px;color:var(--muted)}
.pics img{width:100%;height:100%;object-fit:cover;display:block}
.done{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.done input{width:18px;height:18px;accent-color:var(--ok)}
.req.is-done .says{text-decoration:line-through;color:var(--muted)}
.none{padding:52px 24px;color:var(--muted);display:grid;gap:6px;justify-items:center;text-align:center}
.none b{color:var(--ink);font-size:16px}
.none .ok-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);margin-bottom:6px}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}
.link.bad{color:var(--bad)}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;gap:7px;align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.06)}
.btn.plain{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.plain:hover{background:var(--hover);filter:none}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.btn.danger{background:none;border:1px solid transparent;color:var(--bad)}
.btn.danger:hover{border-color:color-mix(in srgb,var(--bad) 40%,transparent);filter:none}
.btn[disabled]{opacity:.5;cursor:default}
.gate{max-width:440px;margin:12vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:36px 34px 30px;display:grid;gap:12px;text-align:center;box-shadow:0 18px 50px -24px rgb(0 0 0 / .35)}
.gate p{margin:0;font-size:13px;color:var(--muted)}
.gate-logo{display:block;margin:0 auto 6px}.gate-logo img{display:block;width:200px;height:auto;margin:0 auto}
.gate h2{font-size:28px;margin:4px 0 0}
.gate .gate-sub{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;margin-bottom:8px}
.gate .field{text-align:left}.gate .field label{display:block;text-align:center;font-size:15px}
.gate input{font-size:17px;padding:12px 14px;text-align:center}
.gate .btn{font-size:17px;padding:13px 18px}
.gate .err{text-align:center}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field label{font-size:13px;font-weight:600}
.field input,.pw-edit input{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);width:100%;min-height:40px}
.field input:focus,.pw-edit input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field small{color:var(--muted);font-size:12px}
.err{color:var(--bad)!important;font-size:13px;margin:0}
.stack{display:grid;gap:20px;max-width:980px;width:100%;margin:0 auto}
.page-hd h2{font-size:26px}.page-hd p{margin:4px 0 0;color:var(--muted);font-size:14px}
.pad{padding:20px 24px 24px;display:grid;gap:16px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
@media (max-width:620px){.form{grid-template-columns:minmax(0,1fr)}}
.form-foot{display:flex;justify-content:flex-end}
.crow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px 20px;padding:16px 24px;border-top:1px solid var(--line);align-items:center}
.card-hd+.crow{border-top:0}
@media (max-width:760px){.crow{grid-template-columns:minmax(0,1fr)}}
.crow b{font-weight:600;font-size:15px}
.meta{display:grid;gap:2px;margin-top:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.pw-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 11px;max-width:100%}
.pw{font:600 14px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.mini{background:none;border:0;border-radius:6px;padding:5px;color:var(--muted);display:inline-grid;place-items:center}
.mini:hover{background:var(--hover);color:var(--ink)}
.pw-edit{display:grid;gap:8px}
.crow .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:760px){.crow .acts{justify-content:flex-start}}
.send{margin:0 24px 20px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.send-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.send-hd .label{margin:0}
.sendbox{padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6;user-select:all}
.veil{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;place-items:center;padding:20px}
.veil img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;background:#fff}
.veil .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.veil a,.veil button{background:#fff;color:#24221f;border:0;border-radius:6px;padding:9px 14px;font-weight:600;text-decoration:none;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}

/* ---------- Overview (the cockpit) ---------- */
.home{display:grid;gap:22px;width:100%}
.home-hd{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.home-hd .label{margin-bottom:6px}
.home-hd h1{font-size:34px;line-height:1.1}
.lede{margin:8px 0 0;color:var(--muted);font-size:15px}
.lede b{color:var(--ink)}
.row-acts{display:flex;flex-wrap:wrap;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px 15px;text-align:left;display:grid;gap:4px;align-content:start;min-width:0;box-shadow:0 1px 2px rgb(0 0 0 / .04);position:relative;overflow:hidden}
button.tile:hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line))}
.tile .t-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:7px;align-items:center}
.tile .t-num{font:600 38px/1.05 var(--display);font-variant-numeric:tabular-nums;color:var(--ink);margin-top:4px}
.tile .t-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tile.hot{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.tile.hot::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent)}
.tile.hot .t-num{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.dot.on{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.dot.ok{background:var(--ok)}
.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}
.card-hd.tight{padding:14px 20px}
.card-hd.tight h2{font-size:19px}
.status{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.card-hd+.status{border-top:0}
.mono-av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:600 14px/1 var(--display);letter-spacing:.02em;background:color-mix(in srgb,var(--accent) 14%,var(--paper));color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line))}
.status b{font-weight:600}
.status .when{font-size:13px;color:var(--muted)}
.status .links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px}
.status .links a{font-size:13px;color:var(--muted);text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.status .links a:hover{color:var(--ink);text-decoration:underline}
.status .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:560px){.status{grid-template-columns:auto minmax(0,1fr)}.status .right{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap}}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);color:var(--muted)}
.pill.on{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.feed{list-style:none;margin:0;padding:6px 0}
.feed li button{width:100%;background:none;border:0;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:10px 20px;align-items:baseline}
.feed li button:hover{background:var(--hover)}
.feed .dot{transform:translateY(-1px)}
.feed .what{font-size:14px}
.feed .what b{font-weight:600}
.feed .snip{grid-column:2;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .t{grid-column:2;font-size:12px;color:var(--muted)}
.quiet{padding:28px 20px;color:var(--muted);font-size:14px;text-align:center}
/* ---------- Contacts ---------- */
.page-hd{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.find{position:relative;max-width:360px;width:100%}
.find input{padding:9px 12px 9px 36px;border-radius:8px;border:1px solid var(--line);background:var(--paper);width:100%;min-height:40px}
.find input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.find .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.grp-hd{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.grp-hd label{display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.grp-hd input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.grp-hd h2{font-size:19px;line-height:1.2}
.person{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:6px 20px;padding:13px 20px;border-top:1px solid var(--line);align-items:center}
.grp-hd+.person{border-top:0}
@media (max-width:760px){.person{grid-template-columns:minmax(0,1fr)}}
.person b{font-weight:600}
.person .role{font-size:13px;color:var(--muted)}
.reach{display:flex;flex-wrap:wrap;gap:6px 8px}
.reach a{display:inline-flex;gap:7px;align-items:center;font-size:14px;color:var(--ink);text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow-wrap:anywhere}
.reach a:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.reach a .ico{color:var(--muted)}
.person .note{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:-2px}
.person .acts{display:flex;gap:6px;justify-content:flex-end}
@media (max-width:760px){.person .acts{justify-content:flex-start}}
.pform{padding:16px 20px 18px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 60%,var(--paper));display:grid;gap:14px}
.pform .form{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:620px){.pform .form{grid-template-columns:minmax(0,1fr)}}
.pform .form-foot{gap:8px}
/* ---------- Analytics ---------- */
.stack.wide{max-width:none}
.ga-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:20px}
.ga-sum .tile{cursor:default}
.ga-nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
